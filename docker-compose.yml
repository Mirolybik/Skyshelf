# SkyShelf test stand: docker compose
# Запуск: ./deploy.sh   (или docker compose up -d --build)
name: skyshelf

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-skyshelf}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-skyshelf}
      POSTGRES_DB: ${DB_NAME:-skyshelf}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-skyshelf} -d ${DB_NAME:-skyshelf}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Примечание: миграции выполняются скриптом deploy.sh через bind-mount
  # исходников (не зависят от кэша сборки образов).

  seed:
    profiles: ["seed"]
    image: node:20-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USER:-skyshelf}:${DB_PASSWORD:-skyshelf}@db:5432/${DB_NAME:-skyshelf}
      APP_DEMO: "true"
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/scripts:/app/scripts:ro
      - ./backend/node_modules:/app/node_modules:ro
    working_dir: /app
    entrypoint: ["node"]
    command: ["scripts/seed-demo.js"]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      SERVER_ADDRESS: 0.0.0.0
      NODE_ENV: production
      DATABASE_URL: postgres://${DB_USER:-skyshelf}:${DB_PASSWORD:-skyshelf}@db:5432/${DB_NAME:-skyshelf}
      APP_STORAGE: ${APP_STORAGE:-local}
      APP_STORAGE_DIR: /data/objects
      SKYSHELF_MASTER_KEY: ${SKYSHELF_MASTER_KEY:-U2t5U2hlbGYtRGVtby1NYXN0ZXItS2V5LTIwMjYhISE=}
      # Демо-аккаунты создаёт seed (./deploy.sh без --no-seed); автодемо при
      # старте backend выключено, чтобы запуск не зависел от состояния БД.
      APP_DEMO: ${APP_DEMO:-true}
      # MinIO включается profile "minio": APP_STORAGE=minio + переменные ниже
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER:-skyshelf}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-skyshelf-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-skyshelf}
    volumes:
      # Каталог хранилища объектов — отдельным томом напрямую в /data/objects.
      # /data принадлежит root, а процесс работает под uid 1000 (USER node),
      # поэтому писать в него напрямую нельзя; Docker инициализирует новый том
      # правами процесса в контейнере (аналогично каталогу данных PostgreSQL).
      - objectdata:/data/objects
      # Исходники и зависимости монтируются с хоста: стенд не зависит от
      # кэша сборки образов (актуальный код всегда внутри контейнера).
      - ./backend/src:/app/src:ro
      - ./backend/scripts:/app/scripts:ro
      - ./backend/node_modules:/app/node_modules:ro
    # Хелсчек у backend намеренно отсутствует: готовность стенда проверяет
    # deploy.sh через /api/health (nginx → backend).

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${STAND_PORT:-8088}:80"

  minio:
    profiles: ["minio"]
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-skyshelf}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-skyshelf-secret}
    volumes:
      - miniodata:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  objectdata:
  miniodata:
